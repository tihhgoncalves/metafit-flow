name: Sincronizar main para develop

on:
  workflow_run:
    workflows:
      - Deploy MetaFit Flow
    branches:
      - main
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-main-to-develop
  cancel-in-progress: false

jobs:
  sync:
    name: Sincronizar produção com homologação
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout de develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Configurar autoria da automação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Incorporar main em develop
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main develop

          if git merge --no-ff --no-edit origin/main; then
            exit 0
          fi

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)

          if [ "${#conflicts[@]}" -eq 1 ] && [ "${conflicts[0]}" = "package.json" ]; then
            echo "Resolvendo o conflito de versão com o package.json de main."
            git checkout --theirs package.json
            git add package.json
            git commit --no-edit
            exit 0
          fi

          echo "Não foi possível sincronizar main em develop automaticamente."
          echo "Resolva o conflito preservando as tarefas de homologação e execute a sincronização novamente."
          git status --short
          git merge --abort
          exit 1

      - name: Enviar sincronização para develop
        run: git push origin HEAD:develop
